<!doctype html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sports hub </title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous" />
	<link rel="stylesheet" type="text/css" href="assets/css/style.css" />
</head>

<body>
	  <!-- Header -->
  <header class="hero-header text-white py-5 px-3 position-relative">
    <button id="themeToggle" class="btn btn-outline-light btn-sm position-absolute top-0 end-0 m-3" title="Cambia tema">
      <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>

    <div class="container text-center">
      <h1 class="fw-bold mb-1">SportsHub</h1>
      <p class="text-white-50 mb-4">Cerca una squadra, scopri prossime partite o ultimi risultati.</p>
      
      <form id="searchForm" class="search-wrapper mx-auto d-flex gap-2">
        <input type="text" id="searchInput" class="form-control" placeholder="es. Arsenal, Lakers, Real Madrid" required>
        <button type="submit" class="btn btn-light fw-bold text-primary-custom px-4">Cerca</button>
      </form>
    </div>
  </header>

  <main class="container my-4">
    <!-- Sezione Preferiti -->
    <section class="mb-5">
      <h2 class="h4 fw-bold mb-3 d-flex align-items-center gap-2">
        <i class="bi bi-star-fill text-warning"></i> Le tue squadre preferite
      </h2>
      <div id="favoritesContainer"></div>
    </section>

    <!-- Sezione Risultati Ricerca -->
    <section>
      <h2 class="h4 fw-bold mb-3">Squadre trovate</h2>
      <div id="searchResultsContainer">
        <p class="text-body-secondary fst-italic">Inizia cercando una squadra qui sopra.</p>
      </div>
    </section>
  </main>
	

	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
		integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
		crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
		integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
		crossorigin="anonymous"></script>
	<script src="assets/js/script.js"></script>
</body>

</html>
